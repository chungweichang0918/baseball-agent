[project]
name = "bbagent"
version = "0.1.0"
description = "多模態棒球戰術決策 Agent：YOLO 影片分析 + Gemini 推理 + RE24 查表"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.4",
    "ultralytics>=8.3",
    "lap>=0.5.12",          # ByteTrack 追蹤需要；Ultralytics 自動安裝在 uv 環境中可能失敗
    "opencv-python>=4.10",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "gradio>=5.0",
    "google-genai>=1.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bbagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
